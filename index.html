<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METAEARTH — Commercials & Drone Imagery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --black: #080808;
    --near-black: #111111;
    --charcoal: #1a1a1a;
    --mid: #2c2c2c;
    --text: #e8e4dc;
    --muted: #888880;
    --white: #f5f2ed;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  /* ── NAV ── */
  #main-nav {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
    background: rgba(8,8,8,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(201,169,110,0.15);
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    color: var(--gold);
    cursor: pointer;
    text-decoration: none;
  }
  .nav-logo span { color: var(--white); }

  /* ── HERO / LANDING ── */
  #landing {
    height: 100vh;
    background: var(--black);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .hero-grid {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr);
    opacity: 0.12; pointer-events: none;
  }
  .hero-grid-cell {
    border: 1px solid var(--gold);
    animation: pulse-grid 4s ease-in-out infinite alternate;
  }
  .hero-grid-cell:nth-child(3n) { animation-delay: 0.5s; }
  .hero-grid-cell:nth-child(5n) { animation-delay: 1s; }
  @keyframes pulse-grid {
    from { opacity: 0.3; } to { opacity: 1; }
  }

  .hero-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 24px;
    animation: fadeUp 1s ease both;
  }
  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 10vw, 9rem);
    letter-spacing: 0.06em;
    line-height: 0.9;
    text-align: center;
    color: var(--white);
    animation: fadeUp 1s 0.15s ease both;
  }
  .hero-title em {
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    color: var(--gold);
  }
  .hero-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--muted);
    margin-top: 20px;
    letter-spacing: 0.05em;
    animation: fadeUp 1s 0.3s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(30px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* ── SEARCH ── */
  .search-wrapper {
    margin-top: 48px;
    width: min(700px, 90vw);
    position: relative;
    animation: fadeUp 1s 0.45s ease both;
    z-index: 10;
  }
  .search-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(201,169,110,0.4);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    padding: 16px 56px 16px 24px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.3s, background 0.3s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus {
    border-color: var(--gold);
    background: rgba(255,255,255,0.08);
  }
  .search-icon {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    color: var(--gold); pointer-events: none;
    font-size: 1.1rem;
  }
  #search-results {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0;
    background: rgba(17,17,17,0.98);
    border: 1px solid rgba(201,169,110,0.3);
    max-height: 320px; overflow-y: auto;
    display: none;
  }
  .search-result-item {
    padding: 12px 20px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 12px;
    transition: background 0.2s;
  }
  .search-result-item:hover { background: rgba(201,169,110,0.1); }
  .sr-cat { font-size: 0.65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.15em; }
  .sr-title { font-size: 0.9rem; color: var(--text); }

  /* ── TAGS ── */
  .tags-bar {
    margin-top: 32px;
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    max-width: 900px;
    animation: fadeUp 1s 0.6s ease both;
  }
  .tag-pill {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid rgba(201,169,110,0.35);
    color: var(--gold-light);
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.25s;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
  }
  .tag-pill:hover, .tag-pill.active {
    background: var(--gold);
    color: var(--black);
    border-color: var(--gold);
  }

  .scroll-hint {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: var(--muted); font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
    animation: bob 2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(8px)} }
  .scroll-arrow { width: 1px; height: 40px; background: linear-gradient(to bottom, var(--gold), transparent); }

  /* ── CATEGORY GRID (index) ── */
  #category-index {
    padding: 100px 40px 80px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .section-label {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 40px;
    display: flex; align-items: center; gap: 16px;
  }
  .section-label::after {
    content: ''; flex: 1; height: 1px; background: linear-gradient(to right, rgba(201,169,110,0.4), transparent);
  }

  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 2px;
  }
  .cat-card {
    position: relative;
    aspect-ratio: 16/10;
    overflow: hidden;
    cursor: pointer;
    background: var(--charcoal);
    border: 1px solid rgba(255,255,255,0.04);
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  .cat-card:hover { transform: scale(1.01); z-index: 2; }
  .cat-card-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transition: transform 0.6s ease;
    filter: brightness(0.5) saturate(0.8);
  }
  .cat-card:hover .cat-card-bg { transform: scale(1.08); filter: brightness(0.65) saturate(1); }
  .cat-card-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(8,8,8,0.7));
    pointer-events: none;
  }
  .cat-card-content {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 20px 22px;
  }
  .cat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .cat-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    color: var(--white);
    line-height: 1;
  }
  .cat-count {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 5px;
  }
  .cat-tags-mini {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;
  }
  .ctag {
    font-size: 0.55rem;
    padding: 2px 7px;
    background: rgba(201,169,110,0.15);
    color: var(--gold-light);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 1px;
  }

  /* ── CATEGORY PAGE ── */
  .cat-page {
    display: none;
    min-height: 100vh;
    padding-top: 64px;
  }
  .cat-page.active { display: block; }

  .cat-hero {
    position: relative;
    height: clamp(340px, 55vh, 580px);
    overflow: hidden;
    display: flex; align-items: flex-end;
  }
  .cat-hero-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: brightness(0.45) saturate(0.9);
  }
  .cat-hero-gradient {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  .cat-hero-content {
    position: relative; z-index: 2;
    padding: 48px 60px;
    width: 100%;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold); cursor: pointer; border: none; background: none;
    margin-bottom: 20px; padding: 0; font-family: 'DM Sans', sans-serif;
    transition: gap 0.2s;
  }
  .back-btn:hover { gap: 12px; }
  .cat-hero-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 5rem;
    line-height: 1;
    color: rgba(201,169,110,0.2);
    position: absolute; right: 60px; bottom: 48px;
    font-style: italic;
    pointer-events: none;
  }
  .cat-hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 6vw, 5.5rem);
    letter-spacing: 0.06em;
    color: var(--white);
    line-height: 0.9;
  }
  .cat-hero-desc {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--gold-light);
    margin-top: 12px;
    max-width: 500px;
  }
  .cat-hero-tags {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px;
  }
  .hero-tag {
    font-size: 0.62rem; padding: 5px 12px;
    border: 1px solid rgba(201,169,110,0.5);
    color: var(--gold-light);
    letter-spacing: 0.12em; text-transform: uppercase;
    border-radius: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .hero-tag:hover { background: var(--gold); color: var(--black); }

  /* ── VIDEO GRID ── */
  .videos-section {
    padding: 60px 48px 80px;
    max-width: 1500px; margin: 0 auto;
  }
  .videos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
  }
  .video-card {
    background: var(--charcoal);
    border: 1px solid rgba(255,255,255,0.05);
    overflow: hidden;
    transition: border-color 0.3s, transform 0.3s;
    position: relative;
  }
  .video-card:hover {
    border-color: rgba(201,169,110,0.3);
    transform: translateY(-3px);
  }
  .video-wrapper {
    position: relative;
    padding-top: 56.25%;
    background: var(--near-black);
  }
  .video-wrapper iframe {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }
  .video-meta {
    padding: 16px 18px;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .video-title {
    font-size: 0.82rem;
    font-weight: 400;
    color: var(--text);
    letter-spacing: 0.03em;
    text-transform: capitalize;
  }
  .video-idx {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem;
    color: var(--gold);
    flex-shrink: 0;
    margin-left: 10px;
  }

  /* ── FEATURED FIRST VIDEO (large) ── */
  .video-card.featured {
    grid-column: 1 / -1;
  }
  .video-card.featured .video-wrapper {
    padding-top: 42%;
  }

  /* ── FOOTER ── */
  footer {
    padding: 40px 60px;
    border-top: 1px solid rgba(201,169,110,0.15);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px;
  }
  .footer-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem; letter-spacing: 0.15em; color: var(--gold);
  }
  .footer-copy {
    font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em;
  }

  /* ── FILTERED HIDDEN ── */
  .cat-card.hidden, .video-card.hidden { display: none !important; }

  /* ── DIVIDER ── */
  .gold-rule {
    width: 60px; height: 1px; background: var(--gold);
    margin: 32px 0;
  }

  /* ── PALETTE variations per page ── */
  .palette-crimson  { --accent: #c0392b; --accent-light: #f5a99a; }
  .palette-cobalt   { --accent: #2563b0; --accent-light: #93c5fd; }
  .palette-emerald  { --accent: #16a34a; --accent-light: #86efac; }
  .palette-violet   { --accent: #7c3aed; --accent-light: #c4b5fd; }
  .palette-amber    { --accent: #d97706; --accent-light: #fcd34d; }
  .palette-teal     { --accent: #0d9488; --accent-light: #99f6e4; }
  .palette-rose     { --accent: #e11d48; --accent-light: #fda4af; }
  .palette-indigo   { --accent: #4338ca; --accent-light: #a5b4fc; }
  .palette-slate    { --accent: #475569; --accent-light: #cbd5e1; }
  .palette-orange   { --accent: #ea580c; --accent-light: #fed7aa; }
  .palette-pink     { --accent: #db2777; --accent-light: #f9a8d4; }
  .palette-sky      { --accent: #0284c7; --accent-light: #bae6fd; }
  .palette-lime     { --accent: #65a30d; --accent-light: #d9f99d; }
  .palette-stone    { --accent: #78716c; --accent-light: #e7e5e4; }
  .palette-cyan     { --accent: #0891b2; --accent-light: #a5f3fc; }
  .palette-fuchsia  { --accent: #a21caf; --accent-light: #f0abfc; }

  .cat-hero .cat-hero-gradient {
    background: linear-gradient(to right, rgba(8,8,8,0.9) 0%, rgba(8,8,8,0.5) 60%, transparent 100%),
                linear-gradient(to top, rgba(8,8,8,0.9) 0%, transparent 60%);
  }

  /* accent bars on cat pages */
  .accent-bar {
    height: 3px;
    background: var(--accent, var(--gold));
    margin-bottom: 0;
  }

  /* sub-category tabs */
  .sub-tabs {
    display: flex; gap: 0; flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 40px;
  }
  .sub-tab {
    padding: 14px 28px;
    font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--muted); cursor: pointer; border: none; background: transparent;
    font-family: 'DM Sans', sans-serif;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: all 0.2s;
  }
  .sub-tab:hover { color: var(--text); }
  .sub-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* ── LAZY IFRAME PLACEHOLDER ── */
  .video-placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--near-black);
    cursor: pointer;
    gap: 12px;
  }
  .video-placeholder-thumb {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: brightness(0.55);
  }
  .play-btn-circle {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(201,169,110,0.9);
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 2;
    transition: transform 0.2s, background 0.2s;
    flex-shrink: 0;
  }
  .play-btn-circle:hover { transform: scale(1.1); background: var(--gold); }
  .play-btn-circle svg { width: 22px; height: 22px; fill: var(--black); margin-left: 3px; }
  .play-label {
    position: relative; z-index: 2;
    font-size: 0.65rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--gold-light);
  }

  /* ─── MOBILE-FIRST RESPONSIVE ─── */

  /* NAV mobile */
  @media (max-width: 600px) {
    #main-nav {
      padding: 0 16px;
      height: 52px;
    }
    .nav-tagline { display: none; }
    .nav-logo { font-size: 1.2rem; }
  }

  /* HERO / LANDING mobile */
  @media (max-width: 600px) {
    #landing {
      padding: 0 16px;
      text-align: center;
      justify-content: center;
    }
    .hero-eyebrow {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      margin-bottom: 16px;
    }
    .hero-title {
      font-size: clamp(3.2rem, 14vw, 4.5rem);
      letter-spacing: 0.04em;
    }
    .hero-sub {
      font-size: 0.95rem;
      margin-top: 14px;
      padding: 0 8px;
      text-align: center;
    }
    .search-wrapper {
      margin-top: 28px;
      width: 92vw;
    }
    .search-input {
      font-size: 0.95rem;
      padding: 14px 44px 14px 18px;
    }
    .tags-bar {
      margin-top: 20px;
      gap: 8px;
      padding: 0 4px;
      max-width: 100vw;
    }
    .tag-pill {
      font-size: 0.62rem;
      padding: 6px 12px;
      letter-spacing: 0.08em;
    }
    .scroll-hint { display: none; }
  }

  /* CATEGORY INDEX mobile */
  @media (max-width: 600px) {
    #category-index {
      padding: 72px 12px 48px;
    }
    .section-label {
      font-size: 0.6rem;
      margin-bottom: 24px;
    }
    .categories-grid {
      grid-template-columns: 1fr;
      gap: 1px;
    }
    .cat-card {
      aspect-ratio: 16/9;
    }
    .cat-name { font-size: 1.25rem; }
  }

  @media (min-width: 601px) and (max-width: 900px) {
    #category-index { padding: 80px 20px 60px; }
    .categories-grid { grid-template-columns: 1fr 1fr; gap: 2px; }
  }

  /* CATEGORY PAGE HERO mobile */
  @media (max-width: 600px) {
    .cat-page { padding-top: 52px; }
    .cat-hero {
      height: auto;
      min-height: 280px;
    }
    .cat-hero-content {
      padding: 28px 18px 24px;
    }
    .back-btn {
      font-size: 0.6rem;
      margin-bottom: 14px;
    }
    .cat-hero-title {
      font-size: clamp(2rem, 9vw, 3rem);
    }
    .cat-hero-desc {
      font-size: 0.92rem;
      margin-top: 8px;
      max-width: 100%;
    }
    .cat-hero-tags { margin-top: 12px; gap: 6px; }
    .hero-tag { font-size: 0.58rem; padding: 4px 10px; }
    .cat-hero-number { display: none; }
  }

  /* SUB-TABS mobile — horizontal scroll */
  @media (max-width: 600px) {
    .sub-tabs {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 0;
      margin-bottom: 24px;
    }
    .sub-tabs::-webkit-scrollbar { display: none; }
    .sub-tab {
      padding: 12px 18px;
      white-space: nowrap;
      flex-shrink: 0;
      font-size: 0.62rem;
    }
  }

  /* VIDEO GRID mobile */
  @media (max-width: 600px) {
    .videos-section { padding: 24px 12px 60px; }
    .videos-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }
    /* No featured span on mobile */
    .video-card.featured { grid-column: auto; }
    .video-card.featured .video-wrapper { padding-top: 56.25%; }
    .video-meta { padding: 12px 14px; }
    .video-title { font-size: 0.78rem; }
  }

  @media (min-width: 601px) and (max-width: 1024px) {
    .videos-section { padding: 40px 24px 60px; }
    .videos-grid { grid-template-columns: 1fr 1fr; gap: 16px; }
    .video-card.featured .video-wrapper { padding-top: 56.25%; }
  }

  /* FOOTER mobile */
  @media (max-width: 600px) {
    footer {
      padding: 28px 16px;
      flex-direction: column;
      text-align: center;
      gap: 8px;
    }
  }

  /* Touch-friendly tap targets */
  @media (hover: none) {
    .cat-card:hover { transform: none; }
    .video-card:hover { transform: none; border-color: rgba(255,255,255,0.05); }
  }
</style>
</head>
<body>

<!-- ═══════════ NAVIGATION ═══════════ -->
<nav id="main-nav">
  <a class="nav-logo" onclick="showLanding()">META<span>EARTH</span></a>
  <div class="nav-tagline" style="display:flex;align-items:center;gap:24px;">
    <span style="font-size:0.65rem;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;">Commercials & Drone Imagery</span>
  </div>
</nav>

<!-- ═══════════ LANDING / SEARCH ═══════════ -->

//  GRADIENT BACKGROUNDS per category (CSS gradients)
// ═══════════════════════════════════════════════════

// Build all video search index
const VIDEO_INDEX = [];
CATEGORIES.forEach(cat => {
  cat.videos.forEach(v => {
    VIDEO_INDEX.push({ catId: cat.id, catName: cat.name, title: v.title, vimeoId: v.id });
  });
});

// ═══════════════════════════════════════════════════
//  BUILD CATEGORY CARDS
// ═══════════════════════════════════════════════════
function buildCategoryGrid() {
  const grid = document.getElementById('cat-grid');
  CATEGORIES.forEach((cat, i) => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.dataset.tags = cat.tags.join(' ').toLowerCase();
    card.innerHTML = `
      <div class="cat-card-bg" style="background:${cat.gradient}"></div>
      <div class="cat-card-overlay"></div>
      <div class="cat-card-content">
        <div class="cat-num">${cat.num}</div>
        <div class="cat-name">${cat.name}</div>
        <div class="cat-count">${cat.videos.filter(v=>!v.placeholder).length} film${cat.videos.filter(v=>!v.placeholder).length!==1?'s':''}</div>
        <div class="cat-tags-mini">
          ${cat.tags.slice(0,3).map(t=>`<span class="ctag">${t}</span>`).join('')}
        </div>
      </div>
    `;
    card.addEventListener('click', () => showCategoryPage(cat.id));
    grid.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════
//  BUILD CATEGORY PAGES  (lazy-load iframes)
// ═══════════════════════════════════════════════════

// Clean Vimeo URL — title=0&byline=0&portrait=0 hide the overlay meta,
// dnt=1 avoids tracking (helps with 403 on some embeds),
// no autoplay/loop params at load time to prevent 403s
function vimeoSrc(id) {
  return `https://player.vimeo.com/video/${id}?title=0&byline=0&portrait=0&dnt=1&badge=0`;
}

function makeVideoCard(v, i, catGradient) {
  if (v.placeholder) {
    return `<div class="video-card" data-subcat="${v.subCat||''}">
      <div class="video-wrapper" style="background:${catGradient};">
        <div class="video-placeholder">
          <div style="text-align:center;padding:40px;position:relative;z-index:2;">
            <div style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:1.3rem;margin-bottom:8px;">Coming Soon</div>
            <div style="font-size:0.65rem;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;">Videos Loading</div>
          </div>
        </div>
      </div>
      <div class="video-meta">
        <span class="video-title">${v.title}</span>
      </div>
    </div>`;
  }

  const featured = i === 0 ? 'featured' : '';
  // Lazy: render a tap-to-load placeholder with Vimeo thumbnail
  // Clicking it replaces with the actual iframe — avoids 403 from bulk loading
  // and removes all Vimeo branding from the card view
  const thumbUrl = `https://vumbnail.com/${v.id}.jpg`;

  return `<div class="video-card ${featured}" data-subcat="${v.subCat||''}">
    <div class="video-wrapper" id="vw-${v.id}-${i}">
      <div class="video-placeholder" onclick="loadVimeo(this, '${v.id}', '${v.id}-${i}')">
        <div class="video-placeholder-thumb" style="background-image:url('${thumbUrl}')"></div>
        <div class="play-btn-circle">
          <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
        </div>
        <span class="play-label">Tap to Play</span>
      </div>
    </div>
    <div class="video-meta">
      <span class="video-title">${v.title.replace(/_/g,' ')}</span>
      <span class="video-idx">${String(i+1).padStart(2,'0')}</span>
    </div>
  </div>`;
}

function loadVimeo(placeholder, vimeoId, uid) {
  const wrapper = document.getElementById(`vw-${uid}`);
  if (!wrapper) return;
  const iframe = document.createElement('iframe');
  iframe.src = vimeoSrc(vimeoId) + '&autoplay=1';
  iframe.frameBorder = '0';
  iframe.allow = 'autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media';
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:none;';
  placeholder.replaceWith(iframe);
}

function buildCategoryPages() {
  const container = document.getElementById('pages-container');
  CATEGORIES.forEach(cat => {
    const page = document.createElement('div');
    page.className = `cat-page ${cat.palette}`;
    page.id = `page-${cat.id}`;

    const hasSubs = cat.subCategories && cat.subCategories.length > 0;
    const subTabsHTML = hasSubs ? `
      <div class="sub-tabs" id="subtabs-${cat.id}">
        <button class="sub-tab active" onclick="filterSubCat('${cat.id}','all')">All</button>
        ${cat.subCategories.map(s=>`<button class="sub-tab" onclick="filterSubCat('${cat.id}','${s}')">${s}</button>`).join('')}
      </div>
    ` : '';

    const videosHTML = cat.videos.map((v, i) => makeVideoCard(v, i, cat.gradient)).join('');

    page.innerHTML = `
      <div class="accent-bar"></div>
      <div class="cat-hero">
        <div class="cat-hero-bg" style="background:${cat.gradient}"></div>
        <div class="cat-hero-gradient"></div>
        <div class="cat-hero-content">
          <button class="back-btn" onclick="showLanding()">← Back to Repository</button>
          <h2 class="cat-hero-title">${cat.name}</h2>
          <p class="cat-hero-desc">${cat.desc}</p>
          <div class="cat-hero-tags">
            ${cat.tags.map(t=>`<span class="hero-tag" onclick="filterByTag('${t}')">${t}</span>`).join('')}
          </div>
        </div>
        <div class="cat-hero-number">${cat.num}</div>
      </div>
      <div class="videos-section">
        ${subTabsHTML}
        <div class="videos-grid" id="grid-${cat.id}">
          ${videosHTML}
        </div>
      </div>
    `;
    container.appendChild(page);
  });
}

// ═══════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════
let currentPage = null;

function showLanding() {
  document.getElementById('landing').style.display = 'flex';
  document.getElementById('category-index').style.display = 'block';
  if (currentPage) {
    document.getElementById(`page-${currentPage}`).classList.remove('active');
    currentPage = null;
  }
  window.scrollTo(0, 0);
}

function showCategoryPage(catId) {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('category-index').style.display = 'none';
  if (currentPage && currentPage !== catId) {
    document.getElementById(`page-${currentPage}`).classList.remove('active');
  }
  document.getElementById(`page-${catId}`).classList.add('active');
  currentPage = catId;
  window.scrollTo(0, 0);
}

// ═══════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════
function doSearch(val) {
  const box = document.getElementById('search-results');
  if (!val.trim()) { box.style.display = 'none'; return; }
  const q = val.toLowerCase();
  const results = [];

  CATEGORIES.forEach(cat => {
    const matchCat = cat.name.toLowerCase().includes(q) || cat.tags.some(t=>t.includes(q));
    if (matchCat) results.push({ type: 'category', cat, label: cat.name, sub: `${cat.videos.filter(v=>!v.placeholder).length} films · ${cat.tags.slice(0,2).join(', ')}` });
    cat.videos.forEach(v => {
      if (!v.placeholder && v.title.toLowerCase().includes(q)) {
        results.push({ type: 'video', cat, label: v.title, sub: cat.name });
      }
    });
  });

  if (!results.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = results.slice(0,8).map(r => `
    <div class="search-result-item" onclick="showCategoryPage('${r.cat.id}')">
      <div>
        <div class="sr-cat">${r.type === 'category' ? '📁 Category' : '🎬 Video'}</div>
        <div class="sr-title">${r.label}</div>
        <div class="sr-cat">${r.sub}</div>
      </div>
    </div>
  `).join('');
}

function searchKeydown(e) {
  if (e.key === 'Escape') {
    document.getElementById('search-results').style.display = 'none';
    e.target.blur();
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrapper')) {
    document.getElementById('search-results').style.display = 'none';
  }
});

// ═══════════════════════════════════════════════════
//  TAG FILTERING
// ═══════════════════════════════════════════════════
function filterByTag(tag) {
  document.querySelectorAll('.tag-pill').forEach(p => {
    p.classList.toggle('active', p.textContent.trim().toLowerCase() === tag.toLowerCase());
  });
  document.querySelectorAll('.cat-card').forEach(card => {
    card.classList.toggle('hidden', !card.dataset.tags.includes(tag.toLowerCase()));
  });
  // Go back to landing if on a page
  showLanding();
  setTimeout(() => {
    document.getElementById('category-index').scrollIntoView({ behavior: 'smooth' });
  }, 80);
}

// ═══════════════════════════════════════════════════
//  SUB-CATEGORY FILTER
// ═══════════════════════════════════════════════════
function filterSubCat(catId, subCat) {
  document.querySelectorAll(`#subtabs-${catId} .sub-tab`).forEach(btn => {
    btn.classList.toggle('active',
      (subCat === 'all' && btn.textContent.trim() === 'All') ||
      btn.textContent.trim() === subCat
    );
  });
  document.querySelectorAll(`#grid-${catId} .video-card`).forEach(card => {
    card.classList.toggle('hidden',
      subCat !== 'all' && card.dataset.subcat !== subCat
    );
  });
}

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
buildCategoryGrid();
buildCategoryPages();
</script>
